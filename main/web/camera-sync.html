<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISMA-P CAMERA · Camera Sync</title><link rel="stylesheet" href="/shared.css"></head><body><header class="site-header"><div><a class="brand" href="/">PRISMA<span class="dashp">-P</span></a><span class="product-tag">CAMERA</span></div><nav class="topnav"><a href="/">PRODUCT</a><a class="active" href="/camera-sync">CAMERA SYNC</a><a href="/admin">ADMIN</a></nav></header><main class="shell"><section class="hero" style="padding-bottom:20px"><div class="eyebrow">OPERATIONAL SURFACE</div><h1 style="font-size:clamp(42px,7vw,76px)">CAMERA SYNC</h1><p>Interfaz operativa del producto. CS001 construye la navegación completa sin inicializar la OV5640, sin capturar frames y sin iniciar streaming.</p></section><div class="tabs" id="tabs"></div><section class="workarea" id="panel"></section></main><footer class="footer"><div class="shell"><span>PRISMA-P CAMERA · CAMERA SYNC · CS001</span><a href="https://vudum.com.ar/" target="_blank" rel="noopener">Vudum Developments</a></div></footer><script>
const areas={
