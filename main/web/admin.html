<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISMA-P CAMERA · Admin</title><link rel="stylesheet" href="/shared.css"></head><body><header class="site-header"><div><a class="brand" href="/">PRISMA<span class="dashp">-P</span></a><span class="product-tag">CAMERA</span></div><nav class="topnav"><a href="/">PRODUCT</a><a href="/camera-sync">CAMERA SYNC</a><a class="active" href="/admin">ADMIN</a></nav></header><main class="shell layout"><aside class="sidebar" id="sections"></aside><section class="content"><div class="eyebrow">APPLIANCE ADMINISTRATION</div><h1 id="title">OVERVIEW</h1><p class="intro" id="intro">Estado general de la base CS001.</p><div id="body"></div></section></main><footer class="footer"><div class="shell"><span>PRISMA-P CAMERA · ADMIN · CS001</span><a href="https://vudum.com.ar/" target="_blank" rel="noopener">Vudum Developments</a></div></footer><script>
const names=['OVERVIEW','DEVICE','NETWORK','STORAGE','DISPLAY','TOUCH','CAMERA HW','SENSORS','POWER','CONNECTIVITY','SECURITY','SYSTEM','DIAGNOSTICS','UPDATE','ABOUT'];
const planned={STORAGE:'Storage path pendiente de validación física.',TOUCH:'CST816 presente en el hardware, intencionalmente no inicializado en CS001.','CAMERA HW':'OV5640 presente, intencionalmente no inicializada en CS001.',SENSORS:'Sólo se activarán sensores físicamente validados.',POWER:'Telemetría de energía se habilitará sólo si el hardware la expone.','CONNECTIVITY':'mDNS, ESP-NOW y BLE se incorporan en builds posteriores.','SYSTEM':'Reboot, factory reset, backup/restore y configuración persistente llegan después.','DIAGNOSTICS':'La matriz de diagnóstico se completa a medida que los subsistemas se activan.','UPDATE':'OTA/rollback no están activos en CS001.'};
let state=null,current='OVERVIEW';const nav=document.querySelector('#sections'),body=document.querySelector('#body'),title=document.querySelector('#title'),intro=document.querySelector('#intro');
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cards(items){return '<div class="grid">'+items.map(([k,v,n])=>'<div class="card '+(n?'planned':'')+'"><span class="label">'+esc(k)+'</span><strong>'+esc(v)+'</strong>'+(n?'<p>'+esc(n)+'</p>':'')+'</div>').join('')+'</div>'}
function render(){[...nav.children].forEach(b=>b.classList.toggle('active',b.textContent===current));title.textContent=current;let x=[];let note='';if(!state){body.innerHTML='<div class="notice">No se pudo leer /api/v1/status todavía.</div>';return}switch(current){case'OVERVIEW':intro.textContent='Estado general del appliance. CS001 sólo expone funciones reales de base.';x=[['Health',state.health],['Firmware',state.firmware],['Display',state.display?.state],['SoftAP',state.softap?.enabled?'ready':'error'],['SSID',state.softap?.ssid],['AP IP',state.softap?.ip],['Clients',state.softap?.clients],['Heap free',state.memory?.heap_free],['PSRAM total',state.memory?.psram_total],['Camera',state.camera?.state,'Intencionalmente fuera de CS001'],['Touch',state.touch?.state,'Intencionalmente fuera de CS001']];break;case'DEVICE':intro.textContent='Identidad y recursos del ESP32-S3.';x=[['Model',state.device?.model],['Cores',state.device?.cores],['Revision',state.device?.revision],['Flash bytes',state.device?.flash_bytes],['PSRAM total',state.memory?.psram_total],['PSRAM free',state.memory?.psram_free],['Heap free',state.memory?.heap_free],['Heap minimum',state.memory?.heap_min],['Hostname',state.hostname]];break;case'NETWORK':intro.textContent='Red local de fábrica. mDNS y STA están deliberadamente fuera de CS001.';x=[['SoftAP',state.softap?.enabled?'ON':'OFF'],['Security',state.softap?.open?'OPEN':'PROTECTED'],['SSID',state.softap?.ssid],['IP',state.softap?.ip],['Connected clients',state.softap?.clients],['Max clients',state.softap?.max_clients],['Hostname',state.hostname],['mDNS',state.mdns?.state,'Deferred to CS002'],['Wi-Fi STA','planned','No activo en CS001']];break;case'DISPLAY':intro.textContent='Pantalla física del producto.';x=[['State',state.display?.state],['Controller',state.display?.controller],['Resolution',(state.display?.width||0)+' × '+(state.display?.height||0)],['Refresh mode','static','Una sola presentación; sin loop de redraw']];break;case'SECURITY':intro.textContent='Política inicial deliberadamente abierta para la fundación del producto.';x=[['AP security','OPEN'],['AP password','OFF'],['Admin authentication','OFF'],['Sessions','planned','Se incorpora después de estabilizar la base']];note='CS001 no debe utilizarse como configuración final de seguridad de producto.';break;case'ABOUT':intro.textContent='Identidad canónica del producto.';x=[['Product',state.product],['Application',state.application],['Vendor',state.vendor],['Firmware',state.firmware],['Build',state.build],['Hostname',state.hostname]];break;default:intro.textContent=planned[current]||'Área permanente de administración.';x=[[current,'planned',planned[current]||'No activo en CS001']];}
body.innerHTML=cards(x)+(note?'<div class="notice">'+esc(note)+'</div>':'');}
names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{current=n;render()};nav.appendChild(b)});
async function load(){try{const r=await fetch('/api/v1/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);state=await r.json()}catch(e){state=null}render()}
load();setInterval(()=>{if(!document.hidden)load()},5000);
</script></body></html>
