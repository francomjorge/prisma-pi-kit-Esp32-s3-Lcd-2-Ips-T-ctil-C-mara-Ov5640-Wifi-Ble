case'DISPLAY':intro.textContent='LCD ST7789 sobre el bus SPI compartido con la microSD.';html=cards([['State',state.display?.state],['Controller',state.display?.controller],['Resolution',(state.display?.width||0)+' × '+(state.display?.height||0)],['SPI','40 MHz'],['SCLK','GPIO 39'],['MOSI','GPIO 38'],['MISO','GPIO 40'],['LCD CS','GPIO 45'],['SD CS','GPIO 41'],['Preview','OFF','La pantalla permanece estática hasta validar la plataforma y el stream']]);break;
case'TOUCH':intro.textContent='CST816 detectado; navegación táctil sigue deshabilitada.';html=cards([['Probe',state.touch?.state],['Controller',state.touch?.controller],['I²C address','0x'+Number(state.touch?.address||0).toString(16).padStart(2,'0').toUpperCase()],['Chip ID',state.touch?.chip_id_hex],['SDA','GPIO 48'],['SCL','GPIO 47'],['Gestures','OFF'],['Error',state.touch?.error]]);break;
case'CAMERA HW':intro.textContent='Inventario OV5640 solamente. CS005 todavía no solicita frames.';html=cards([['Probe',state.camera?.state],['Sensor',state.camera?.sensor],['Expected OV5640',state.camera?.expected_sensor?'YES':'NO'],['PID',state.camera?.pid_hex],['XCLK',state.camera?.xclk_hz+' Hz'],['Frame buffers',state.camera?.fb_count],['FB location',state.camera?.fb_location],['Capture','OFF','Sin snapshot, stream ni preview'],['Error',state.camera?.error]]);break;
case'SENSORS':intro.textContent='No activamos sensores adicionales hasta validarlos por hardware.';html=cards([['Additional sensors','PLANNED','El hardware se incorporará por módulos de diagnóstico, no por supuestos']]);break;
case'POWER':intro.textContent='Siguiente candidato de infraestructura: batería y alimentación.';html=cards([['Battery ADC','PLANNED'],['Power source','PLANNED'],['Sleep policy','PLANNED']]);break;

case'DIAGNOSTICS':intro.textContent='Diagnóstico cruzado de infraestructura.';html=cards([['Overall health',state.health],['Display',state.display?.state],['Camera HW',state.camera?.state],['Touch HW',state.touch?.state],['Shared SPI',state.storage?.shared_spi_ready?'READY':'ERROR'],['Internal FS',state.storage?.internal?.mounted?'MOUNTED':state.storage?.internal?.error],['microSD',state.storage?.sd?.mounted?'MOUNTED':state.storage?.sd?.error],['SoftAP',state.softap?.enabled?'ready':'error'],['STA',state.sta?.connected?'connected':state.sta?.configured?'configured/disconnected':'off'],['mDNS',state.mdns?.state],['Heap free',bytes(state.memory?.heap_free)],['Heap min',bytes(state.memory?.heap_min)],['PSRAM free',bytes(state.memory?.psram_free)]]);break;

body.innerHTML=html;document.querySelector('#footerNet').textContent=state.mdns_url||state.softap?.ip||'local appliance';if(current==='NETWORK')setTimeout(bindNetwork,0)}
function renderNetwork(){const x=cards([['Mode','AP + STA'],['AP SSID',state.softap?.ssid],['AP IP',state.softap?.ip],['Security',state.softap?.security],['Channel',state.softap?.channel],['AP clients',state.softap?.clients+' / '+state.softap?.max_clients],['STA configured',state.sta?.configured?'YES':'NO'],['STA connected',state.sta?.connected?'YES':'NO'],['STA SSID',state.sta?.ssid||'—'],['STA IP',state.sta?.ip||'—'],['STA RSSI',state.sta?.connected?state.sta?.rssi+' dBm':'—'],['mDNS',state.mdns_url]]);if(!config)return x;return x+formPanel('AP / DEVICE IDENTITY','<form id="apForm" class="form-grid">'+field('Friendly name','friendly_name',config.friendly_name)+field('Hostname (.local)','hostname',config.hostname)+field('AP SSID','ap_ssid',config.ap?.ssid)+selectField('AP security','ap_open',config.ap?.open?'1':'0',[['1','OPEN · no password'],['0','WPA2-PSK']])+field('New AP password','ap_password','', 'password','placeholder="8–63 chars; blank keeps current" autocomplete="new-password"')+selectField('Channel','channel',config.ap?.channel,Array.from({length:13},(_,i)=>[String(i+1),String(i+1)]))+selectField('Max clients','max_clients',config.ap?.max_clients,[['1','1'],['2','2'],['3','3'],['4','4']])+'<div class="form-actions"><button type="submit" class="button primary">SAVE · REBOOT REQUIRED</button></div></form>')+formPanel('WI‑FI STA','<div class="form-actions"><button class="button" id="scanBtn">SCAN NETWORKS</button><button class="button danger-btn" id="forgetBtn">FORGET STA</button></div><div id="scanResults" class="scan-list"></div><form id="staForm" class="form-grid">'+field('SSID','ssid',state.sta?.ssid||'')+field('Password','password','', 'password','placeholder="blank for open network" autocomplete="new-password"')+'<div class="form-actions"><button type="submit" class="button primary">CONNECT + SAVE</button></div></form>')}
function renderStorage(){const i=state.storage?.internal||{},s=state.storage?.sd||{};let html='<div class="grid"><div class="card"><span class="label">INTERNAL · SPIFFS</span><strong>'+(i.mounted?'MOUNTED':'NOT MOUNTED')+'</strong><p>'+bytes(i.used_bytes)+' used / '+bytes(i.total_bytes)+' · '+bytes(i.free_bytes)+' free</p><div class="storage-meter"><i style="width:'+pct(i.used_bytes,i.total_bytes)+'%"></i></div><p>Mount: /internal · Open handles: '+(i.max_open_files||12)+'</p></div><div class="card"><span class="label">MICROSD · FAT/SDSPI</span><strong>'+(s.mounted?'MOUNTED':'NOT MOUNTED')+'</strong><p>'+bytes(s.used_bytes)+' used / '+bytes(s.total_bytes)+' · '+bytes(s.free_bytes)+' free</p><div class="storage-meter"><i style="width:'+pct(s.used_bytes,s.total_bytes)+'%"></i></div><p>Mount: /sdcard · CS GPIO41 · Open handles: '+(s.max_open_files||12)+'</p></div></div>';html+='<div class="storage-policy"><b>Política:</b> sin límite artificial de cantidad de archivos, sin auto-format en boot, sin borrado recursivo. El límite <b>12</b> es sólo de archivos abiertos simultáneamente.</div><div class="form-actions" style="margin-top:16px">'+(!i.mounted?'<button class="button danger-btn" onclick="initInternal()">INITIALIZE INTERNAL</button>':'<button class="button" onclick="goFiles()">OPEN FILES</button>')+(!s.mounted?'<button class="button" onclick="retrySD()">RETRY SD MOUNT</button>':'<button class="button" onclick="goFiles()">OPEN SD FILES</button>')+'</div>';if(!i.mounted)html+='<div class="notice">Initialize Internal formatea únicamente la partición dedicada <b>storage</b>. No toca firmware, NVS ni la SD.</div>';return html}
async function postForm(url,data={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));try{return JSON.parse(text)}catch{return{text}}}
async function initInternal(){if(!confirm('Inicializar /internal? Se borrará sólo la partición interna de archivos.'))return;try{await postForm('/api/v1/storage/internal/init');notice('Internal inicializado y montado.');await load()}catch(e){notice(e.message,'error')}}

function bindNetwork(){const ap=document.querySelector('#apForm');if(ap)ap.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(ap).entries()),r=await postForm('/api/v1/config/network',d);notice(r.reboot_required?'Guardado. Reboot requerido para aplicar AP/hostname.':'Guardado.')}catch(err){notice(err.message,'error')}};const sta=document.querySelector('#staForm');if(sta)sta.onsubmit=async e=>{e.preventDefault();try{await postForm('/api/v1/network/connect',Object.fromEntries(new FormData(sta).entries()));notice('Conexión STA iniciada; AP sigue como fallback.');setTimeout(load,1800)}catch(err){notice(err.message,'error')}};const sb=document.querySelector('#scanBtn');if(sb)sb.onclick=async()=>{const box=document.querySelector('#scanResults');box.innerHTML='<div class="muted">Scanning…</div>';try{const r=await postForm('/api/v1/network/scan');box.innerHTML=(r.networks||[]).map(n=>'<button class="scan-item" data-ssid="'+esc(n.ssid)+'"><span>'+esc(n.ssid||'(hidden)')+'</span><small>'+n.rssi+' dBm · CH '+n.channel+' · '+esc(n.security)+'</small></button>').join('')||'<div class="muted">No networks found</div>';box.querySelectorAll('.scan-item').forEach(b=>b.onclick=()=>{sta.elements.ssid.value=b.dataset.ssid})}catch(err){box.innerHTML='<div class="notice danger">'+esc(err.message)+'</div>'}};const fb=document.querySelector('#forgetBtn');if(fb)fb.onclick=async()=>{try{await postForm('/api/v1/network/forget');notice('Red STA olvidada.');setTimeout(load,700)}catch(err){notice(err.message,'error')}}}

function parentPath(p){if(p==='/')return '/';const a=p.replace(/\/$/,'').split('/');a.pop();return a.length<=1?'/':a.join('/')}
function joinPath(p,n){return p==='/'?'/'+n:p+'/'+n}
function ext(n){const i=n.lastIndexOf('.');return i>=0?n.slice(i).toLowerCase():''}
function isImage(n){return ['.jpg','.jpeg','.png','.gif','.webp','.bmp'].includes(ext(n))}
function isText(n){return ['.txt','.log','.md','.json','.csv','.ini','.cfg','.yaml','.yml','.html','.css','.js'].includes(ext(n))}
function query(url,o){return url+'?'+new URLSearchParams(o).toString()}

function paneHtml(v){return '<section class="file-pane '+(paneMounted(v)?'':'offline')+'" id="pane-'+v+'"><div class="file-pane-head"><span class="file-pane-title">'+(v==='internal'?'INTERNAL':'SD')+'</span><span class="file-space" id="space-'+v+'">'+paneSpace(v)+'</span></div><div class="file-path" id="path-'+v+'">/</div><div class="file-toolbar"><button data-a="up">UP</button><button data-a="refresh">REFRESH</button><button data-a="mkdir">NEW DIR</button><button data-a="upload">UPLOAD</button><button data-a="download">DOWNLOAD</button><button data-a="rename">RENAME</button><button data-a="delete">DELETE</button><button data-a="copy">COPY →</button><input type="file" id="upload-'+v+'" multiple hidden></div><div class="file-list" id="list-'+v+'"></div></section>'}
function bindPane(v){const el=document.querySelector('#pane-'+v);el.querySelectorAll('button').forEach(b=>b.onclick=()=>fileAction(v,b.dataset.a));document.querySelector('#upload-'+v).onchange=e=>uploadFiles(v,[...e.target.files])}
function drawPane(v){const p=pane[v],list=document.querySelector('#list-'+v),path=document.querySelector('#path-'+v),space=document.querySelector('#space-'+v);if(!list)return;path.textContent=p.path;space.textContent=paneSpace(v);if(!paneMounted(v)){list.innerHTML='<div class="file-empty">Volume not mounted.<br>Use STORAGE to initialize/retry.</div>';return}list.innerHTML='';if(!p.entries.length){list.innerHTML='<div class="file-empty">Empty directory</div>';return}p.entries.forEach(e=>{const row=document.createElement('div');row.className='file-row '+(e.type==='dir'?'dir':'')+(p.selected&&p.selected.name===e.name?' selected':'');const icon=document.createElement('span');icon.className='file-icon';icon.textContent=e.type==='dir'?'▰':'▪';const name=document.createElement('span');name.className='file-name';name.textContent=e.name;const size=document.createElement('span');size.className='file-size';size.textContent=e.type==='dir'?'DIR':bytes(e.size);row.append(icon,name,size);row.onclick=()=>{if(e.type==='dir'){p.path=joinPath(p.path,e.name);listPane(v).catch(x=>paneError(v,x))}else{p.selected=e;drawPane(v);preview(v,e)}};list.appendChild(row)})}
function paneError(v,e){const list=document.querySelector('#list-'+v);if(list)list.innerHTML='<div class="file-empty">'+esc(e.message)+'</div>'}
async function preview(v,e){const box=document.querySelector('#preview');if(!box)return;const path=joinPath(pane[v].path,e.name);box.textContent='Loading '+e.name+'…';if(isImage(e.name)){const img=document.createElement('img');img.src=query('/api/v1/files/download',{volume:v,path,inline:1});img.alt=e.name;box.innerHTML='';box.appendChild(img)}else if(isText(e.name)&&Number(e.size)<=262144){try{const r=await fetch(query('/api/v1/files/download',{volume:v,path,inline:1}),{cache:'no-store'});if(!r.ok)throw Error(await r.text());const pre=document.createElement('pre');pre.textContent=await r.text();box.innerHTML='';box.appendChild(pre)}catch(x){box.textContent=x.message}}else box.innerHTML='<b>'+esc(e.name)+'</b><br>'+bytes(e.size)+'<br>Preview not available; use DOWNLOAD.'}
async function fileAction(v,a){if(!paneMounted(v)){notice(v+' no está montado','error');return}const p=pane[v],sel=p.selected;try{if(a==='up'){p.path=parentPath(p.path);await listPane(v)}else if(a==='refresh')await listPane(v);else if(a==='mkdir'){const n=prompt('Nombre de carpeta:');if(!n)return;await postForm('/api/v1/files/mkdir',{volume:v,path:joinPath(p.path,n)});await listPane(v)}else if(a==='upload')document.querySelector('#upload-'+v).click();else if(a==='download'){if(!sel)return notice('Seleccioná un archivo','error');window.open(query('/api/v1/files/download',{volume:v,path:joinPath(p.path,sel.name)}),'_blank')}else if(a==='rename'){if(!sel)return notice('Seleccioná archivo/carpeta','error');const n=prompt('Nuevo nombre:',sel.name);if(!n||n===sel.name)return;await postForm('/api/v1/files/rename',{volume:v,from:joinPath(p.path,sel.name),to:joinPath(p.path,n)});await listPane(v)}else if(a==='delete'){if(!sel)return notice('Seleccioná archivo/carpeta','error');if(!confirm('Eliminar '+sel.name+'? Carpetas deben estar vacías.'))return;await postForm('/api/v1/files/delete',{volume:v,path:joinPath(p.path,sel.name)});await listPane(v);document.querySelector('#preview').textContent='Select a file.'}else if(a==='copy'){if(!sel)return notice('Seleccioná un archivo','error');if(sel.type==='dir')return notice('Copy de directorios queda deliberadamente deshabilitado en CS005','error');const dest=v==='internal'?'sd':'internal';if(!paneMounted(dest))return notice('Volumen destino no montado','error');await postForm('/api/v1/files/copy',{source_volume:v,source_path:joinPath(p.path,sel.name),dest_volume:dest,dest_path:joinPath(pane[dest].path,sel.name)});await listPane(dest);notice('Copiado a '+dest.toUpperCase())}}catch(e){notice(e.message,'error')}}
async function uploadFiles(v,files){if(!files.length)return;for(let i=0;i<files.length;i++){const f=files[i],path=joinPath(pane[v].path,f.name);notice('Uploading '+(i+1)+'/'+files.length+': '+f.name);const r=await fetch(query('/api/v1/files/upload',{volume:v,path}),{method:'POST',body:f});if(!r.ok){notice('Upload '+f.name+': '+await r.text(),'error');break}}document.querySelector('#upload-'+v).value='';await listPane(v);await refreshStatusOnly();notice('Upload finalizado.')}
async function refreshStatusOnly(){try{const r=await fetch('/api/v1/status',{cache:'no-store'});if(r.ok)state=await r.json()}catch(e){}}
names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{current=n;render()};nav.appendChild(b)});
async function load(){try{const [sr,cr]=await Promise.all([fetch('/api/v1/status',{cache:'no-store'}),fetch('/api/v1/config',{cache:'no-store'})]);if(!sr.ok)throw Error(sr.status);state=await sr.json();config=cr.ok?await cr.json():null}catch(e){state=null;config=null}render()}
load();setInterval(()=>{if(!document.hidden&&!['NETWORK','FILES'].includes(current))load()},8000);
</script></body></html>
