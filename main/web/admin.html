<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISMA-PI CAMERA SYNTH · Admin</title><link rel="stylesheet" href="/shared.css"></head><body><header class="site-header"><div><a class="brand" href="/">PRISMA<span class="dashp">-PI</span></a><span class="product-tag">CAMERA SYNTH</span></div><nav class="topnav"><a href="/">PRODUCT</a><a href="/camera-synth">CAMERA SYNTH</a><a class="active" href="/admin">ADMIN</a></nav></header><main class="shell layout"><aside class="sidebar" id="sections"></aside><section class="content"><div class="eyebrow">APPLIANCE ADMINISTRATION</div><h1 id="title">OVERVIEW</h1><p class="intro" id="intro">CS004 · hardware, configuración persistente y red.</p><div id="message"></div><div id="body"></div></section></main><footer class="footer"><div class="shell"><span>VUDUM DEVELOPMENTS · PRISMA-PI CAMERA SYNTH · ADMIN · CS004</span><span id="footerNet">local appliance</span></div></footer><script>
const names=['OVERVIEW','DEVICE','NETWORK','STORAGE','DISPLAY','TOUCH','CAMERA HW','SENSORS','POWER','CONNECTIVITY','SECURITY','SYSTEM','DIAGNOSTICS','UPDATE','ABOUT'];
const planned={SENSORS:'No hay sensores adicionales validados todavía.',POWER:'No hay telemetría de batería/alimentación validada todavía.','UPDATE':'Las particiones OTA existen, pero el actualizador todavía no está implementado.'};
let state=null,config=null,current='OVERVIEW';const nav=document.querySelector('#sections'),body=document.querySelector('#body'),title=document.querySelector('#title'),intro=document.querySelector('#intro'),message=document.querySelector('#message');
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cards(items){return '<div class="grid">'+items.map(([k,v,n])=>'<div class="card '+(n?'planned':'')+'"><span class="label">'+esc(k)+'</span><strong>'+esc(v)+'</strong>'+(n?'<p>'+esc(n)+'</p>':'')+'</div>').join('')+'</div>'}
function notice(t,kind='ok'){message.innerHTML=t?'<div class="notice '+(kind==='error'?'danger':'')+'">'+esc(t)+'</div>':''}
function formPanel(titleText,html){return '<section class="form-panel"><h2>'+esc(titleText)+'</h2>'+html+'</section>'}
function field(label,name,value,type='text',extra=''){return '<label class="field"><span>'+esc(label)+'</span><input type="'+type+'" name="'+name+'" value="'+esc(value??'')+'" '+extra+'></label>'}
function selectField(label,name,value,opts){return '<label class="field"><span>'+esc(label)+'</span><select name="'+name+'">'+opts.map(o=>'<option value="'+esc(o[0])+'" '+(String(value)===String(o[0])?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'}
function render(){[...nav.children].forEach(b=>b.classList.toggle('active',b.textContent===current));title.textContent=current;message.innerHTML='';let x=[],html='',note='';if(!state){body.innerHTML='<div class="notice danger">No se pudo leer /api/v1/status.</div>';return}switch(current){
case'OVERVIEW':intro.textContent='Resumen real del appliance antes de habilitar captura de imágenes.';x=[['Health',state.health],['Firmware',state.firmware],['Reset',state.reset_reason],['Display',state.display?.state],['Camera',state.camera?.state],['Sensor',state.camera?.sensor],['Camera PID',state.camera?.pid_hex],['Touch',state.touch?.state],['Touch ID',state.touch?.chip_id_hex],['AP',state.softap?.ssid],['AP security',state.softap?.security],['STA',state.sta?.connected?'CONNECTED':state.sta?.configured?'CONFIGURED':'OFF'],['mDNS',state.mdns_url],['Heap free',state.memory?.heap_free],['PSRAM free',state.memory?.psram_free]];html=cards(x);break;
case'DEVICE':intro.textContent='Identidad, memoria y silicio del ESP32-S3.';x=[['Product',state.product],['Friendly name',state.friendly_name],['Model',state.device?.model],['Cores',state.device?.cores],['Revision',state.device?.revision],['Flash bytes',state.device?.flash_bytes],['PSRAM total',state.memory?.psram_total],['PSRAM free',state.memory?.psram_free],['Heap free',state.memory?.heap_free],['Heap minimum',state.memory?.heap_min],['Wi-Fi STA MAC',state.device?.wifi_sta_mac],['Wi-Fi AP MAC',state.device?.wifi_ap_mac],['Settings schema',state.settings_schema]];html=cards(x);break;
case'NETWORK':intro.textContent='SoftAP de recuperación + Wi‑Fi STA. Los cambios de AP/hostname se aplican tras reboot.';x=[['Mode','AP + STA'],['AP SSID',state.softap?.ssid],['AP IP',state.softap?.ip],['Security',state.softap?.security],['Channel',state.softap?.channel],['AP clients',state.softap?.clients+' / '+state.softap?.max_clients],['STA configured',state.sta?.configured?'YES':'NO'],['STA connected',state.sta?.connected?'YES':'NO'],['STA SSID',state.sta?.ssid||'—'],['STA IP',state.sta?.ip||'—'],['STA RSSI',state.sta?.connected?state.sta?.rssi+' dBm':'—'],['mDNS',state.mdns_url]];html=cards(x);if(config){html+=formPanel('AP / DEVICE IDENTITY','<form id="apForm" class="form-grid">'+field('Friendly name','friendly_name',config.friendly_name)+field('Hostname (.local)','hostname',config.hostname)+field('AP SSID','ap_ssid',config.ap?.ssid)+selectField('AP security','ap_open',config.ap?.open?'1':'0',[['1','OPEN · no password'],['0','WPA2-PSK']])+field('New AP password','ap_password','', 'password','placeholder="8–63 chars; blank keeps current" autocomplete="new-password"')+selectField('Channel','channel',config.ap?.channel,Array.from({length:13},(_,i)=>[String(i+1),String(i+1)]))+selectField('Max clients','max_clients',config.ap?.max_clients,[['1','1'],['2','2'],['3','3'],['4','4']])+'<div class="form-actions"><button type="submit" class="button primary">SAVE · REBOOT REQUIRED</button></div></form>');html+=formPanel('WI‑FI STA','<div class="form-actions"><button class="button" id="scanBtn">SCAN NETWORKS</button><button class="button danger-btn" id="forgetBtn">FORGET STA</button></div><div id="scanResults" class="scan-list"></div><form id="staForm" class="form-grid">'+field('SSID','ssid',state.sta?.ssid||'')+field('Password','password','', 'password','placeholder="leave blank for open network" autocomplete="new-password"')+'<div class="form-actions"><button type="submit" class="button primary">CONNECT + SAVE</button></div></form>');}break;
case'STORAGE':intro.textContent='Inventario de particiones. No se monta ni se simula storage todavía.';x=[['SPIFFS partition',state.storage?.spiffs_partition?'PRESENT':'NOT FOUND'],['SPIFFS bytes',state.storage?.spiffs_bytes],['Mounted',state.storage?.mounted?'YES':'NO','Montaje de filesystem pendiente'],['OTA slot 0',state.storage?.ota0?'PRESENT':'NO'],['OTA slot 1',state.storage?.ota1?'PRESENT':'NO']];html=cards(x);break;
case'DISPLAY':intro.textContent='Hardware LCD validado y presentación estática.';x=[['State',state.display?.state],['Controller',state.display?.controller],['Resolution',(state.display?.width||0)+' × '+(state.display?.height||0)],['SPI',state.display?.spi_hz+' Hz'],['SCLK',state.display?.pins?.sclk],['MOSI',state.display?.pins?.mosi],['MISO',state.display?.pins?.miso],['DC',state.display?.pins?.dc],['CS',state.display?.pins?.cs],['Backlight',state.display?.pins?.backlight],['Preview','OFF','Se habilita después del stream web estable']];html=cards(x);break;
case'TOUCH':intro.textContent='Hardware CST816 detectado; navegación táctil sigue deliberadamente deshabilitada.';x=[['Probe',state.touch?.state],['Controller',state.touch?.controller],['I²C address','0x'+Number(state.touch?.address||0).toString(16).padStart(2,'0').toUpperCase()],['Chip ID',state.touch?.chip_id_hex],['SDA',state.touch?.sda],['SCL',state.touch?.scl],['Gestures',state.touch?.gestures_enabled?'ON':'OFF'],['Error',state.touch?.error]];html=cards(x);break;
case'CAMERA HW':intro.textContent='Inventario OV5640. Seguimos sin solicitar frames.';x=[['Probe',state.camera?.state],['Sensor',state.camera?.sensor],['Expected OV5640',state.camera?.expected_sensor?'YES':'NO'],['PID',state.camera?.pid_hex],['MIDH','0x'+Number(state.camera?.midh||0).toString(16).padStart(2,'0').toUpperCase()],['MIDL','0x'+Number(state.camera?.midl||0).toString(16).padStart(2,'0').toUpperCase()],['Version','0x'+Number(state.camera?.ver||0).toString(16).padStart(2,'0').toUpperCase()],['XCLK',state.camera?.xclk_hz+' Hz'],['Frame buffers',state.camera?.fb_count],['FB location',state.camera?.fb_location],['PWDN',state.camera?.pins?.pwdn],['XCLK pin',state.camera?.pins?.xclk],['SCCB SDA',state.camera?.pins?.sccb_sda],['SCCB SCL',state.camera?.pins?.sccb_scl],['PCLK',state.camera?.pins?.pclk],['VSYNC',state.camera?.pins?.vsync],['HREF',state.camera?.pins?.href],['Capture','OFF','No snapshot/stream/preview en CS004'],['Error',state.camera?.error]];html=cards(x);break;
case'SENSORS':intro.textContent=planned.SENSORS;html=cards([['Additional sensors','NOT VALIDATED',planned.SENSORS]]);break;
case'POWER':intro.textContent=planned.POWER;html=cards([['Power telemetry','NOT VALIDATED',planned.POWER],['Sleep / battery','PLANNED','No se habilita sin soporte físico verificado']]);break;
case'CONNECTIVITY':intro.textContent='Transportes presentes y futuros.';x=[['SoftAP',state.softap?.enabled?'READY':'ERROR'],['Wi‑Fi STA',state.sta?.connected?'CONNECTED':state.sta?.configured?'CONFIGURED':'AVAILABLE'],['mDNS',state.mdns?.state],['mDNS URL',state.mdns_url],['ESP-NOW',state.esp_now?.state,'Visible, no implementado'],['BLE',state.ble?.state,'Visible, no implementado']];html=cards(x);break;
case'SECURITY':intro.textContent='Seguridad actual de la base de desarrollo.';x=[['AP security',state.softap?.security],['AP password',state.softap?.open?'OFF':'CONFIGURED'],['Admin authentication','OFF','Aún no implementada'],['API authentication','OFF','Aún no implementada'],['ESP-NOW security','PLANNED']];html=cards(x)+'<div class="notice">El AP ya puede pasar de abierto a WPA2-PSK. La autenticación de /admin queda visible pero no se finge como implementada.</div>';break;
case'SYSTEM':intro.textContent='Estado de runtime y acciones seguras.';x=[['Firmware',state.firmware],['Build',state.build],['Uptime',state.uptime_s+' s'],['Reset reason',state.reset_reason],['Settings schema',state.settings_schema],['Heap minimum',state.memory?.heap_min]];html=cards(x)+formPanel('SYSTEM ACTIONS','<div class="form-actions"><button class="button danger-btn" id="rebootBtn">REBOOT APPLIANCE</button></div>');break;
case'DIAGNOSTICS':intro.textContent='Diagnóstico cruzado sin iniciar video.';x=[['Overall health',state.health],['Display',state.display?.state],['Camera HW',state.camera?.state],['Camera error',state.camera?.error],['Touch HW',state.touch?.state],['Touch error',state.touch?.error],['SoftAP',state.softap?.enabled?'ready':'error'],['STA',state.sta?.connected?'connected':state.sta?.configured?'configured/disconnected':'off'],['mDNS',state.mdns?.state],['Heap free',state.memory?.heap_free],['Heap min',state.memory?.heap_min],['PSRAM free',state.memory?.psram_free]];html=cards(x);break;
case'UPDATE':intro.textContent=planned.UPDATE;html=cards([['OTA slot 0',state.storage?.ota0?'PRESENT':'NO'],['OTA slot 1',state.storage?.ota1?'PRESENT':'NO'],['Updater','NOT IMPLEMENTED',planned.UPDATE],['Rollback','NOT IMPLEMENTED']]);break;
case'ABOUT':intro.textContent='Identidad canónica del appliance.';x=[['Product',state.product],['Application',state.application],['Vendor',state.vendor],['Friendly name',state.friendly_name],['Firmware',state.firmware],['Build',state.build],['Hostname',state.hostname],['mDNS',state.mdns_url]];html=cards(x);break;
default:html=cards([[current,'PLANNED','No activo todavía']]);}
body.innerHTML=html;if(current==='NETWORK')bindNetwork();if(current==='SYSTEM')bindSystem();document.querySelector('#footerNet').textContent=state.mdns_url||state.softap?.ip||'local appliance';}
async function postForm(url,data={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));try{return JSON.parse(text)}catch{return{text}}}
function bindNetwork(){const ap=document.querySelector('#apForm');if(ap)ap.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(ap),d=Object.fromEntries(f.entries());const r=await postForm('/api/v1/config/network',d);notice(r.reboot_required?'Guardado. Reboot requerido para aplicar AP/hostname.':'Guardado.')}catch(err){notice(err.message,'error')}};const sta=document.querySelector('#staForm');if(sta)sta.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(sta).entries());await postForm('/api/v1/network/connect',d);notice('Conexión STA iniciada. El AP permanece activo como fallback.');setTimeout(load,1800)}catch(err){notice(err.message,'error')}};const sb=document.querySelector('#scanBtn');if(sb)sb.onclick=async()=>{const box=document.querySelector('#scanResults');box.innerHTML='<div class="muted">Scanning…</div>';try{const r=await postForm('/api/v1/network/scan');box.innerHTML=(r.networks||[]).map(n=>'<button class="scan-item" data-ssid="'+esc(n.ssid)+'"><span>'+esc(n.ssid||'(hidden)')+'</span><small>'+n.rssi+' dBm · CH '+n.channel+' · '+esc(n.security)+'</small></button>').join('')||'<div class="muted">No networks found</div>';box.querySelectorAll('.scan-item').forEach(b=>b.onclick=()=>{sta.elements.ssid.value=b.dataset.ssid})}catch(err){box.innerHTML='<div class="notice danger">'+esc(err.message)+'</div>'}};const fb=document.querySelector('#forgetBtn');if(fb)fb.onclick=async()=>{try{await postForm('/api/v1/network/forget');notice('Red STA olvidada.');setTimeout(load,700)}catch(err){notice(err.message,'error')}}}
function bindSystem(){const b=document.querySelector('#rebootBtn');if(b)b.onclick=async()=>{if(!confirm('Reboot PRISMA-PI CAMERA SYNTH?'))return;try{await postForm('/api/v1/system/reboot');notice('Reiniciando… Si cambiaste el AP, reconectate al nuevo SSID.')}catch(err){notice(err.message,'error')}}}
names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{current=n;render()};nav.appendChild(b)});
async function load(){try{const [sr,cr]=await Promise.all([fetch('/api/v1/status',{cache:'no-store'}),fetch('/api/v1/config',{cache:'no-store'})]);if(!sr.ok)throw Error(sr.status);state=await sr.json();config=cr.ok?await cr.json():null}catch(e){state=null;config=null}render()}
load();setInterval(()=>{if(!document.hidden&&current!=='NETWORK')load()},7000);
</script></body></html>
