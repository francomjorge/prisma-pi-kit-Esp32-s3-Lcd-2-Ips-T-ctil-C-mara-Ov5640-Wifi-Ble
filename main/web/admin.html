<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISMA-PI CAMERA SYNTH · Admin</title><link rel="stylesheet" href="/shared.css"></head><body><header class="site-header"><div><a class="brand" href="/">PRISMA<span class="dashp">-PI</span></a><span class="product-tag">CAMERA SYNTH</span></div><nav class="topnav"><a href="/">PRODUCT</a><a href="/camera-synth">CAMERA SYNTH</a><a class="active" href="/admin">ADMIN</a></nav></header><main class="shell layout"><aside class="sidebar" id="sections"></aside><section class="content"><div class="eyebrow">APPLIANCE ADMINISTRATION</div><h1 id="title">OVERVIEW</h1><p class="intro" id="intro">Inventario real de hardware CS003.</p><div id="body"></div></section></main><footer class="footer"><div class="shell"><span>VUDUM DEVELOPMENTS · PRISMA-PI CAMERA SYNTH · ADMIN · CS003</span><a href="http://prisma-pi-camera-synth.local/">prisma-pi-camera-synth.local</a></div></footer><script>
const names=['OVERVIEW','DEVICE','NETWORK','STORAGE','DISPLAY','TOUCH','CAMERA HW','SENSORS','POWER','CONNECTIVITY','SECURITY','SYSTEM','DIAGNOSTICS','UPDATE','ABOUT'];const planned={STORAGE:'Storage pendiente de validación física.',SENSORS:'Sólo se activarán sensores físicamente validados.',POWER:'Telemetría de energía sólo si el hardware la expone.','SYSTEM':'Reboot, factory reset, backup/restore y persistencia llegan después.','DIAGNOSTICS':'La matriz se completa al activar subsistemas.','UPDATE':'OTA/rollback no están activos en CS003.'};let state=null,current='OVERVIEW';const nav=document.querySelector('#sections'),body=document.querySelector('#body'),title=document.querySelector('#title'),intro=document.querySelector('#intro');function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cards(items){return '<div class="grid">'+items.map(([k,v,n])=>'<div class="card '+(n?'planned':'')+'"><span class="label">'+esc(k)+'</span><strong>'+esc(v)+'</strong>'+(n?'<p>'+esc(n)+'</p>':'')+'</div>').join('')+'</div>'}function render(){[...nav.children].forEach(b=>b.classList.toggle('active',b.textContent===current));title.textContent=current;let x=[],note='';if(!state){body.innerHTML='<div class="notice">No se pudo leer /api/v1/status.</div>';return}switch(current){case'OVERVIEW':intro.textContent='CS003 identifica hardware sin capturar frames.';x=[['Health',state.health],['Firmware',state.firmware],['Display',state.display?.state],['Camera',state.camera?.state],['Sensor',state.camera?.sensor],['Camera PID',state.camera?.pid_hex],['Touch',state.touch?.state],['Touch ID',state.touch?.chip_id_hex],['SSID',state.softap?.ssid],['mDNS',state.mdns_url],['Heap free',state.memory?.heap_free],['PSRAM total',state.memory?.psram_total]];break;case'DEVICE':intro.textContent='Identidad y recursos del ESP32-S3.';x=[['Product',state.product],['Model',state.device?.model],['Cores',state.device?.cores],['Revision',state.device?.revision],['Flash bytes',state.device?.flash_bytes],['PSRAM total',state.memory?.psram_total],['PSRAM free',state.memory?.psram_free],['Heap free',state.memory?.heap_free],['Heap minimum',state.memory?.heap_min],['Hostname',state.hostname]];break;case'NETWORK':intro.textContent='Red local y discovery por nombre.';x=[['SoftAP',state.softap?.enabled?'ON':'OFF'],['Security',state.softap?.open?'OPEN':'PROTECTED'],['SSID',state.softap?.ssid],['IP',state.softap?.ip],['Clients',state.softap?.clients],['Hostname',state.hostname],['mDNS',state.mdns?.state],['Local URL',state.mdns_url]];break;case'DISPLAY':intro.textContent='Pantalla física del producto.';x=[['State',state.display?.state],['Controller',state.display?.controller],['Resolution',(state.display?.width||0)+' × '+(state.display?.height||0)],['Refresh','static','Sin preview de cámara']];break;case'TOUCH':intro.textContent='Probe de hardware solamente. Gestos siguen deshabilitados.';x=[['Probe',state.touch?.state],['Controller',state.touch?.controller],['I2C address','0x'+Number(state.touch?.address||0).toString(16).padStart(2,'0').toUpperCase()],['Chip ID',state.touch?.chip_id_hex],['Gestures',state.touch?.gestures_enabled?'ON':'OFF'],['Error',state.touch?.error]];break;case'CAMERA HW':intro.textContent='Identidad OV5640 real. CS003 no solicita ningún frame.';x=[['Probe',state.camera?.state],['Sensor',state.camera?.sensor],['Expected OV5640',state.camera?.expected_sensor?'YES':'NO'],['PID',state.camera?.pid_hex],['MIDH','0x'+Number(state.camera?.midh||0).toString(16).padStart(2,'0').toUpperCase()],['MIDL','0x'+Number(state.camera?.midl||0).toString(16).padStart(2,'0').toUpperCase()],['Version','0x'+Number(state.camera?.ver||0).toString(16).padStart(2,'0').toUpperCase()],['XCLK',state.camera?.xclk_hz+' Hz'],['Frame buffers',state.camera?.fb_count],['FB location',state.camera?.fb_location],['Capture','OFF','Snapshot recién en CS004'],['Error',state.camera?.error]];break;case'CONNECTIVITY':intro.textContent='Transportes y discovery.';x=[['SoftAP',state.softap?.enabled?'ready':'error'],['mDNS',state.mdns?.state],['mDNS URL',state.mdns_url],['ESP-NOW',state.esp_now?.state,'Planned'],['BLE',state.ble?.state,'Planned']];break;case'SECURITY':intro.textContent='Política abierta de desarrollo.';x=[['AP security','OPEN'],['AP password','OFF'],['Admin authentication','OFF']];note='CS003 no representa la seguridad final del producto.';break;case'ABOUT':intro.textContent='Identidad canónica.';x=[['Product',state.product],['Application',state.application],['Vendor',state.vendor],['Firmware',state.firmware],['Build',state.build],['Hostname',state.hostname],['mDNS',state.mdns_url]];break;default:intro.textContent=planned[current]||'Área permanente de administración.';x=[[current,'planned',planned[current]||'No activo en CS003']];}body.innerHTML=cards(x)+(note?'<div class="notice">'+esc(note)+'</div>':'')}names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{current=n;render()};nav.appendChild(b)});async function load(){try{const r=await fetch('/api/v1/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);state=await r.json()}catch(e){state=null}render()}load();setInterval(()=>{if(!document.hidden)load()},5000);
