name: Build Camera Synth CS010U
on:
  push:
    branches: [main, cs010-network-resilience, cs010r-admin-touch-recovery, cs010s-web-crash-hardening, cs010t-legacy-glitch-state, cs010u-black-palette-pagemarkers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject invalid browser scripts before packaging firmware
        shell: bash
        run: |
          set -euo pipefail
          node --check main/web/admin.js
          node tests/admin_smoke.cjs
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Imain tests/ui_legacy_state_test.c -o /tmp/prisma_legacy_ui_test
          /tmp/prisma_legacy_ui_test
          python3 tests/ui_palette_markers_test.py
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for html in Path("main/web").glob("*.html"):
              source = html.read_text(encoding="utf-8")
              for i, script in enumerate(re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", source, re.I | re.S)):
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as tmp:
                      tmp.write(script)
                      tmp.flush()
                      subprocess.run(["node", "--check", tmp.name], check=True)
                      print(f"PASS {html.name}: inline script {i + 1}")
          PY
  firmware:
    needs: web-sanity
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Compile CS010U
        id: compile
        shell: bash
        run: |
          set +e
          . /opt/esp/idf/export.sh
          idf.py build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package CS010U
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd build
          python -m esptool --chip esp32s3 merge_bin -o PRISMA-PI-CAMERA-SYNTH-CS010U-factory.bin @flash_args
          sha256sum PRISMA-PI-CAMERA-SYNTH-CS010U-factory.bin prisma_camera_synth.bin > SHA256SUMS.txt
      - name: Upload CS010U artifacts and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRISMA-PI-CAMERA-SYNTH-CS010U-${{ github.run_number }}
          path: |
            build.log
            build/PRISMA-PI-CAMERA-SYNTH-CS010U-factory.bin
            build/prisma_camera_synth.bin
            build/SHA256SUMS.txt
            build/flasher_args.json
            build/prisma_camera_synth.elf
          if-no-files-found: warn
      - name: Fail workflow when compile failed
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: exit 1
