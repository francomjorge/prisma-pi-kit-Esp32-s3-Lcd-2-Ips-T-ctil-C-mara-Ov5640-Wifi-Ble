name: Build firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build
          cd build
          esptool.py --chip esp32s3 merge_bin -o PRISMA-PI-CAMERA-build-007-factory.bin @flash_args
          sha256sum PRISMA-PI-CAMERA-build-007-factory.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRISMA-PI-CAMERA-build-007-${{ github.run_number }}
          path: |
            build/PRISMA-PI-CAMERA-build-007-factory.bin
            build/SHA256SUMS.txt
            build/flasher_args.json
            build/prisma_camera.elf
          if-no-files-found: error
